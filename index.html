<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poco_Pixel</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: white;
            font-family: Roboto, Arial, sans-serif;
        }

        /* Logo and background elements */
        #logo {
            display: none;
        }

        #logoimg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(162px, 25vw);
            height: min(138px, 21vw);
            z-index: 2;
            transform-origin: center center;
        }

        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* Main buttons */
        #create {
            text-align: center;
            height: min(40px, 8vw);
            width: min(130px, 25vw);
            border-radius: 10px;
            position: absolute;
            z-index: 2;
            top: 50%;
            left: 50%;
            transform: translate(-53%, -50%);
            font-family: Roboto;
            color: white;
            border: 1px solid white;
            background-color: #260e9d51;
            font-weight: bold;
            font-size: clamp(12px, 2.5vw, 16px);
            transition: background-color 0.3s ease;
        }

        #create:hover {
            background-color: white;
            color: black;
            border: 1px solid black;
        }

        #exampleButton {
            position: absolute;
            top: 32%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            height: min(300px, 60vw, 50vh);
            width: min(300px, 60vw, 50vh);
            color: white;
            background-color: rgba(0, 0, 0, 0.089);
            border: 1px solid white;
            font-size: clamp(30px, 8vw, 50px);
            border-radius: 5px;
            cursor: pointer;
        }

        #exampleButton:hover {
            color: black;
            background-color: rgba(255, 255, 255, 0.646);
            border: 1px solid black;
        }

        #finish {
            height: min(40px, 8vw);
            width: min(175px, 35vw);
            border-radius: 10px;
            position: absolute;
            z-index: 3;
            transform: translate(-50%, -50%);
            font-family: Roboto;
            color: white;
            left: 50%;
            border: 1px solid white;
            background-color: rgba(0, 0, 0, 0.911);
            font-weight: bold;
            font-size: clamp(12px, 2.5vw, 16px);
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        #finish:hover {
            background-color: white;
            color: black;
            border: 1px solid black;
        }

        #append {
            position: absolute;
            border: 1px solid white;
            border-radius: 10px;
            height: min(30px, 6vw);
            width: min(150px, 30vw);
            background-color: #260e9d51;
            color: white;
            font-size: clamp(10px, 2vw, 12px);
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 4;
            cursor: pointer;
        }

        /* Container styles */
        #clone-container {
            position: absolute;
            top: 80%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(400px, 90vw);
            height: min(400px, 40vh);
            overflow-y: auto;
            overflow-x: hidden;
            padding: 10px;
            z-index: 2;
            opacity: 0;
        }

        #mini-pieces-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1px;
            max-width: min(300px, 80vw);
            max-height: min(300px, 80vw);
            margin: 0 auto;
        }

        .piece {
            aspect-ratio: 1;
        }

        /* Form input styles */
        .cc {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 5%;
            opacity: 1;
            width: 100%;
        }

        .ans {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 32.5%;
            opacity: 1;
            width: 100%;
        }

        .input-wrapper {
            position: relative;
            width: min(200px, 70vw);
            margin: 0 auto;
        }

        .input {
            width: 100%;
            padding: 10px 10px 10px 5px;
            border: none;
            border-bottom: 1px solid #515151;
            background: transparent;
            color: white;
            font-size: clamp(14px, 3vw, 16px);
            z-index: 1;
            position: relative;
        }

        .input:focus {
            outline: none;
        }

        .text {
            position: absolute;
            top: 10px;
            left: 50%;
            color: #999;
            font-size: clamp(16px, 3.5vw, 18px);
            transform: translateX(-50%);
            transition: 0.2s ease all;
            pointer-events: none;
        }

        .input:focus ~ label,
        .input:valid ~ label {
            top: -20px;
            font-size: clamp(12px, 2.5vw, 14px);
            color: #5264AE;
        }

        .bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 2px;
            width: 100%;
            background: #5264AE;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.2s ease;
        }

        .input:focus ~ .bar {
            transform: scaleX(1);
        }

        .highlight {
            position: absolute;
            top: 25%;
            left: 0;
            height: 60%;
            width: 100%;
            opacity: 0.5;
            background: transparent;
            pointer-events: none;
        }

        .input:focus ~ .highlight {
            animation: inputHighlighter 0.3s ease;
        }

        @keyframes inputHighlighter {
            from {
                background: #5264AE;
                width: 100%;
            }
            to {
                background: transparent;
                width: 0;
            }
        }

        /* Status and error messages */
        #imgStatus {
            position: absolute;
            color: red;
            font-weight: bold;
            font-size: clamp(16px, 4vw, 32px);
            font-family: Roboto;
            z-index: 4;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid white;
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.607);
            pointer-events: none;
            padding: 10px;
            max-width: 90vw;
            text-align: center;
        }

        .error-message {
            color: red !important;
            font-size: clamp(12px, 2.5vw, 14px) !important;
        }

        /* Group containers */
        #group, #ans-group {
            position: relative;
        }

        /* Responsive breakpoints */
        @media screen and (max-width: 768px) {
            #logoimg {
                width: min(120px, 30vw);
                height: min(102px, 25vw);
            }

            #exampleButton {
                height: min(250px, 50vw);
                width: min(250px, 50vw);
                font-size: clamp(25px, 6vw, 40px);
            }

            #clone-container {
                width: 95vw;
                height: 35vh;
            }

            .input-wrapper {
                width: min(180px, 80vw);
            }
        }

        @media screen and (max-width: 480px) {
            #logoimg {
                width: min(100px, 35vw);
                height: min(85px, 30vw);
            }

            #exampleButton {
                height: min(200px, 45vw);
                width: min(200px, 45vw);
                font-size: clamp(20px, 5vw, 35px);
            }

            #create, #finish {
                height: min(35px, 10vw);
                font-size: clamp(11px, 2vw, 14px);
            }

            #append {
                height: min(25px, 8vw);
                font-size: clamp(9px, 1.8vw, 11px);
            }

            .input-wrapper {
                width: min(160px, 85vw);
            }
        }

        @media screen and (orientation: landscape) and (max-height: 600px) {
            #logoimg {
                width: min(120px, 20vh);
                height: min(102px, 17vh);
            }

            #exampleButton {
                height: min(200px, 30vh);
                width: min(200px, 30vh);
            }

            #clone-container {
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <img id="logo" src="Images/h (50).png" alt="logo">
    <img id="background" src="Images/h (50).png" style="opacity: 0;" alt="background">
    <img id="logoimg" src="Images/image-removebg-preview (3).png" style="opacity: 0;" alt="logoimg">
    <canvas id="canvas"></canvas>
    <div id="pieces-container"></div>
    <div id="mini-pieces-container"></div>
    <input type="file" id="example" style="display: none;" accept="image/*">
    <label for="example">
        <button id="exampleButton" style="opacity: 0;" disabled>+</button>
    </label>
    <button id="create" style="opacity: 0;">Empieza</button>
    <div id="imgStatus" style="text-align: center; opacity: 0;">    
        <p>¡Necesitas una Foto!</p>
    </div>
    <div id="clone-container" style="opacity: 0; pointer-events: none;">
        <button id="append" style="opacity: 0; top: 60%;">+</button>
        <button id="finish" style="opacity: 0; top: 80%;">CREAR</button>
        <div id="cc0" class="cc">
            <div id="group">
                <div class="input-wrapper">
                    <input required type="text" class="input" />
                    <label class="text">¿Pregunta?</label>
                    <span class="highlight"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </div>
        <div id="ans0" class="ans">
            <div id="ans-group">
                <div class="input-wrapper">
                    <input required type="text" class="input" />
                    <label class="text">¡Respuesta!</label>
                    <span class="highlight"></span>
                    <span class="bar"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        const fileInput = document.getElementById("example");
        const finishButton = document.getElementById("finish");
        let imageUploaded = false;
        var i = 0;
        let offset = 0;
        const spacing = 20;

        // Utility functions
        function fadeIn(element, duration = 1000, delay = 0, callback = null) {
            element.style.opacity = 0;
            element.style.display = "block";
            let start = null;

            function animate(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let opacity = Math.min(progress / duration, 1);
                element.style.opacity = opacity;

                if (progress < duration) {
                    requestAnimationFrame(animate);
                } else if (callback) {
                    callback();
                }
            }

            setTimeout(() => requestAnimationFrame(animate), delay);
        }

        function fadeOut(element, duration = 1000) {
            let start = null;

            function animate(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let opacity = Math.max(1 - (progress / duration), 0);
                element.style.opacity = opacity;

                if (progress < duration) {
                    requestAnimationFrame(animate);
                } else {
                    element.style.display = "none";
                }
            }

            requestAnimationFrame(animate);
        }

        function fadeOutAllPieces(duration = 1000) {
            const pieces = document.querySelectorAll(".pieceBig");
            pieces.forEach(piece => {
                fadeOut(piece, duration);
            });
        }

        function moveImg() {
            const logoimg = document.getElementById("logoimg");
            const isMobile = window.innerWidth <= 768;
            const targetTop = isMobile ? "200px" : "300px";

            logoimg.style.transition = "top 0.5s ease";
            logoimg.style.top = targetTop;
        }

        function showButton() {
            const div = document.getElementById("create");
            div.style.opacity = 1;
        }

        function addBg() {
            const background = document.getElementById("background");
            const logoimg = document.getElementById("logoimg");

            background.style.opacity = 1;
            logoimg.style.opacity = 1;
            setTimeout(moveImg, 2000);
            setTimeout(showButton, 2500);
        }
        
        function createboxes() {
            const isMobile = window.innerWidth <= 768;
            const cols = isMobile ? 8 : 12;
            const rows = isMobile ? 5 : 7;
            
            const img = document.getElementById("logo");
        
            if (!img.complete || img.naturalWidth === 0) {
                img.onload = createboxes;
                return;
            }
        
            const piecesContainer = document.getElementById("pieces-container");
            piecesContainer.innerHTML = "";
            piecesContainer.style.position = "absolute";
            piecesContainer.style.top = "0";
            piecesContainer.style.left = "0";
            piecesContainer.style.width = "100vw";
            piecesContainer.style.height = "100vh";
            piecesContainer.style.overflow = "hidden";
            piecesContainer.style.display = "grid";
            piecesContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            piecesContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        
            let totalPieces = cols * rows;
            let piecesFadedIn = 0;
        
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const pieceCanvas = document.createElement("canvas");
                    
                    pieceCanvas.style.width = "100%";
                    pieceCanvas.style.height = "100%";
                    pieceCanvas.style.display = "block";
        
                    const pieceCtx = pieceCanvas.getContext("2d");
                    const scale = window.devicePixelRatio || 1;
                    
                    const actualWidth = window.innerWidth / cols;
                    const actualHeight = window.innerHeight / rows;
                    
                    pieceCanvas.width = actualWidth * scale;
                    pieceCanvas.height = actualHeight * scale;
                    pieceCtx.scale(scale, scale);

                    pieceCtx.drawImage(
                        img,
                        (x / cols) * img.naturalWidth,
                        (y / rows) * img.naturalHeight,
                        img.naturalWidth / cols,
                        img.naturalHeight / rows,
                        0,
                        0,
                        actualWidth,
                        actualHeight
                    );
        
                    pieceCanvas.classList.add("pieceBig");
                    pieceCanvas.style.opacity = 0;
                    piecesContainer.appendChild(pieceCanvas);
        
                    const delay = (x + y) * (isMobile ? 150 : 200);
        
                    fadeIn(pieceCanvas, 1000, delay, () => {
                        piecesFadedIn++;
                        if (piecesFadedIn === totalPieces) {
                            setTimeout(addBg, 1000);
                            setTimeout(() => fadeOutAllPieces(1000), 1500);
                        }
                    });
                }
            }
        }

        function splitImage(img) {
            imageUploaded = true;
            const cols = 5;
            const rows = 5;
            const borderWidth = 1;
            
            const maxSize = Math.min(window.innerWidth * 0.8, window.innerHeight * 0.6, 300);
            const totalWidth = maxSize;
            const totalHeight = maxSize;
            
            const cellWidth = totalWidth / cols;
            const cellHeight = totalHeight / rows;

            const canvas = document.getElementById("canvas");
            if (!canvas) return;
            
            canvas.style.zIndex = "3";
            const ctx = canvas.getContext("2d");
            canvas.width = totalWidth;
            canvas.height = totalHeight;
            canvas.style.opacity = "0";
            ctx.drawImage(img, 0, 0, totalWidth, totalHeight);

            const piecesContainer = document.getElementById("mini-pieces-container");
            if (!piecesContainer) return;
            
            piecesContainer.innerHTML = "";
            piecesContainer.style.position = "absolute";
            piecesContainer.style.top = "32%";
            piecesContainer.style.left = "50%";
            piecesContainer.style.width = totalWidth + "px";
            piecesContainer.style.height = totalHeight + "px";
            piecesContainer.style.transform = "translate(-50%, -50%)";
            piecesContainer.style.zIndex = "3";
            piecesContainer.style.display = "grid";
            piecesContainer.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
            piecesContainer.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
            piecesContainer.style.gap = `${borderWidth}px`;
            piecesContainer.style.backgroundColor = "white";
            piecesContainer.style.padding = "0";
            piecesContainer.style.boxSizing = "border-box";
            
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    const pieceWrapper = document.createElement("div");
                    pieceWrapper.className = "piece-wrap";
                    pieceWrapper.style.position = "relative";
                    pieceWrapper.style.overflow = "hidden";
                    pieceWrapper.style.width = "100%";
                    pieceWrapper.style.height = "100%";
                    pieceWrapper.style.boxSizing = "border-box";
                    
                    const sourceX = Math.round(x * (totalWidth / cols));
                    const sourceY = Math.round(y * (totalHeight / rows));
                    const sourceWidth = Math.round((x + 1) * (totalWidth / cols) - sourceX);
                    const sourceHeight = Math.round((y + 1) * (totalHeight / rows) - sourceY);

                    const pieceCanvas = document.createElement("canvas");
                    pieceCanvas.width = sourceWidth;
                    pieceCanvas.height = sourceHeight;
                    pieceCanvas.className = "piece";
                    pieceCanvas.style.display = "block";
                    pieceCanvas.style.width = "100%";
                    pieceCanvas.style.height = "100%";
                    pieceCanvas.style.zIndex = "3";

                    const pieceCtx = pieceCanvas.getContext("2d");
                    pieceCtx.drawImage(
                        canvas,
                        sourceX, sourceY,
                        sourceWidth, sourceHeight,
                        0, 0,
                        sourceWidth, sourceHeight
                    );
                    
                    const blackOverlay = document.createElement("div");
                    blackOverlay.className = "black-overlay";
                    blackOverlay.style.position = "absolute";
                    blackOverlay.style.top = "0";
                    blackOverlay.style.left = "0";
                    blackOverlay.style.width = "100%";
                    blackOverlay.style.height = "100%";
                    blackOverlay.style.backgroundColor = "black";
                    blackOverlay.style.opacity = "0";
                    blackOverlay.style.transition = "opacity 1s ease";
                    blackOverlay.style.zIndex = "10";
                    
                    pieceWrapper.appendChild(pieceCanvas);
                    pieceWrapper.appendChild(blackOverlay);
                    piecesContainer.appendChild(pieceWrapper);
                }
            }
        }

        // Event handlers
        function handleResize() {
            // Adjust logo position on resize
            const logoimg = document.getElementById("logoimg");
            if (logoimg && logoimg.style.opacity !== "0") {
                const isMobile = window.innerWidth <= 768;
                if (logoimg.style.top !== "50%" && logoimg.style.top !== "") {
                    logoimg.style.top = isMobile ? "200px" : "300px";
                }
            }

            // Adjust mini pieces container size
            const piecesContainer = document.getElementById("mini-pieces-container");
            if (piecesContainer && piecesContainer.children.length > 0) {
                const maxSize = Math.min(window.innerWidth * 0.8, window.innerHeight * 0.6, 300);
                piecesContainer.style.width = maxSize + "px";
                piecesContainer.style.height = maxSize + "px";
            }
        }

        // Initialize event listeners
        window.addEventListener("load", () => {
            setTimeout(createboxes, 3000);
        });

        window.addEventListener("resize", handleResize);

        document.addEventListener("DOMContentLoaded", function() {
            // Create button event listener
            const createButton = document.getElementById("create");
            if (createButton) {
                createButton.addEventListener("click", function() {
                    const button = document.getElementById("create");
                    const logo = document.getElementById("logoimg");
                    const question = document.getElementById("clone-container");
                    const example = document.getElementById("example");
                    const exampleButton = document.getElementById("exampleButton");
                    const appendButton = document.getElementById("append");
                    const finish = document.getElementById("finish");

                    const isMobile = window.innerWidth <= 768;
                    const logoScale = isMobile ? 0.5 : 0.6;
                    const logoTop = isMobile ? "40px" : "50px";

                    button.style.opacity = 0;
                    example.style.display = "block";
                    logo.style.transition = "top 1s ease, transform 1s ease";
                    logo.style.top = logoTop;
                    logo.style.transform = `translate(-50%, -50%) scale(${logoScale})`;
                    question.style.opacity = 1;
                    question.style.pointerEvents = "auto";
                    exampleButton.style.opacity = 1;
                    exampleButton.disabled = false;
                    appendButton.style.opacity = 1;
                    finish.style.opacity = 1;
                });
            }

            // Example button event listener
            const exampleButton = document.getElementById("exampleButton");
            if (exampleButton) {
                exampleButton.addEventListener("click", function() {
                    document.getElementById("example").click();
                });
            }
            
            // Initialize error messages
            const ccContainer = document.getElementById("cc0");
            const ansContainer = document.getElementById("ans0");
            
            if (ccContainer && !ccContainer.querySelector('.error-message')) {
                const errorMsg = document.createElement("p");
                errorMsg.className = "error-message";
                errorMsg.id = "cc0-error";
                errorMsg.textContent = "No question provided";
                errorMsg.style.color = "red";
                errorMsg.style.opacity = "0";
                errorMsg.style.transition = "opacity 0.5s ease";
                errorMsg.style.margin = "5px 0";
                ccContainer.appendChild(errorMsg);
            }
            
            if (ansContainer && !ansContainer.querySelector('.error-message')) {
                const errorMsg = document.createElement("p");
                errorMsg.className = "error-message";
                errorMsg.id = "ans0-error";
                errorMsg.textContent = "No answer provided";
                errorMsg.style.color = "red";
                errorMsg.style.opacity = "0";
                errorMsg.style.transition = "opacity 0.5s ease";
                errorMsg.style.margin = "5px 0";
                ansContainer.appendChild(errorMsg);
            }
            
            // Append button event listener
            const appendButton = document.getElementById("append");
            if (appendButton) {
                appendButton.addEventListener("click", function () {
                    const original = document.getElementById("cc0");
                    const answer = document.getElementById("ans0");
                    const container = document.getElementById("clone-container");
                    const finish = document.getElementById("finish");

                    if (!original || !answer || !container || !finish) return;

                    const dupe = original.cloneNode(true);
                    const dupe2 = answer.cloneNode(true);
                    i++;
                    dupe.id = "cc" + i;
                    dupe.classList.add("cc");
                    dupe2.id = "ans" + i;
                    dupe2.classList.add("ans");

                    const dupedInput = dupe.querySelector('input');
                    if (dupedInput) {
                        dupedInput.value = "";
                        dupedInput.disabled = false;
                    }

                    const dupedInput2 = dupe2.querySelector('input');
                    if (dupedInput2) {
                        dupedInput2.value = "";
                        dupedInput2.removeAttribute("value");
                        dupedInput2.classList.remove("correct");
                        dupedInput2.disabled = false;
                    }

                    offset += spacing;
                    dupe.style.top = `calc(${offset}vh)`;
                    dupe2.style.top = `${offset + 10}vh`;
                    appendButton.style.top = `${offset + 20}vh`;
                    finish.style.top = `${offset + 30}vh`;

                    container.appendChild(dupe);
                    container.appendChild(dupe2);

                    setTimeout(() => {
                        const newCcContainer = document.getElementById("cc" + i);
                        const newAnsContainer = document.getElementById("ans" + i);
                        
                        if (newCcContainer && !newCcContainer.querySelector('.error-message')) {
                            const errorMsg = document.createElement("p");
                            errorMsg.className = "error-message";
                            errorMsg.id = "cc" + i + "-error";
                            errorMsg.textContent = "No question provided";
                            errorMsg.style.color = "red";
                            errorMsg.style.opacity = "0";
                            errorMsg.style.transition = "opacity 0.5s ease";
                            errorMsg.style.margin = "5px 0";
                            newCcContainer.appendChild(errorMsg);
                        }
                        
                        if (newAnsContainer && !newAnsContainer.querySelector('.error-message')) {
                            const errorMsg = document.createElement("p");
                            errorMsg.className = "error-message";
                            errorMsg.id = "ans" + i + "-error";
                            errorMsg.textContent = "No answer provided";
                            errorMsg.style.color = "red";
                            errorMsg.style.opacity = "0";
                            errorMsg.style.transition = "opacity 0.5s ease";
                            errorMsg.style.margin = "5px 0";
                            newAnsContainer.appendChild(errorMsg);
                        }
                    }, 100);
                });
            }
            
            // Finish button event listener
            const finishButton = document.getElementById("finish");
            if (finishButton) {
                finishButton.addEventListener("click", function() {
                    if (!imageUploaded) {
                        const imgStatus = document.getElementById("imgStatus");
                        if (imgStatus) {
                            imgStatus.style.opacity = "1";
                            setTimeout(() => {
                                imgStatus.style.opacity = "0";
                            }, 3000);
                        }
                        return;
                    }

                    const ccDivs = document.querySelectorAll('.cc');
                    const ansDivs = document.querySelectorAll('.ans');
                    let allInputsFilled = true;
                    
                    document.querySelectorAll('.error-message').forEach(msg => {
                        msg.style.opacity = "0";
                    });
                    
                    ccDivs.forEach(div => {
                        const input = div.querySelector('input');
                        const errorMsg = div.querySelector('.error-message');
                        if (input && errorMsg && !input.value.trim()) {
                            errorMsg.style.opacity = "1";
                            allInputsFilled = false;
                            setTimeout(() => {
                                errorMsg.style.opacity = "0";
                            }, 3000);
                        }
                    });
                    
                    ansDivs.forEach(div => {
                        const input = div.querySelector('input');
                        const errorMsg = div.querySelector('.error-message');
                        if (input && errorMsg && !input.value.trim()) {
                            errorMsg.style.opacity = "1";
                            allInputsFilled = false;
                            setTimeout(() => {
                                errorMsg.style.opacity = "0";
                            }, 3000);
                        }
                    });

                    if (allInputsFilled && imageUploaded) {
                        const ccData = Array.from(ccDivs).map(div => {
                            const input = div.querySelector('input');
                            if (input) {
                                input.setAttribute('value', input.value);
                            }
                            return div.outerHTML;
                        });

                        const ansData = Array.from(ansDivs).map(div => {
                            const input = div.querySelector('input');
                            if (input) {
                                input.setAttribute('value', input.value);
                            }
                            return div.outerHTML;
                        });

                        const totalPieces = 25;
                        const revealedState = Array(totalPieces).fill(false);
                        
                        localStorage.setItem('ccData', JSON.stringify(ccData));
                        localStorage.setItem('ansData', JSON.stringify(ansData));
                        localStorage.setItem('revealedState', JSON.stringify(revealedState));
                        localStorage.setItem('uploadedImage', document.getElementById("canvas").toDataURL());
                        
                        // Navigate to the game page
                        window.location.href = "Poco_Pixel.html";
                    }
                });
            }
        });

        // File input event listener
        if (fileInput) {
            fileInput.addEventListener("change", function(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        splitImage(img);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // Handle orientation changes
        window.addEventListener("orientationchange", function() {
            setTimeout(handleResize, 100);
        });

        // Touch event handling for mobile
        if ('ontouchstart' in window) {
            document.addEventListener('touchstart', function(e) {
                // Prevent default touch behaviors that might interfere
                if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') {
                    return;
                }
            });
        }
    </script>
</body>
</html>
